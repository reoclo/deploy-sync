name: 'Reoclo Deploy Sync'
description: 'Sync proxy routes with Reoclo after an external container deployment'
branding:
  icon: 'refresh-cw'
  color: 'blue'
inputs:
  api_key:
    description: 'Reoclo tenant API key with `external_deploy` scope'
    required: true
  compose_file:
    description: 'Path to a docker-compose file. Services on the reoclo-proxy network or with `reoclo.managed=true` label are auto-discovered.'
    required: false
  services:
    description: 'Comma-separated list of `container_name:container_port` for non-compose workflows. Mutually exclusive with `compose_file`.'
    required: false
  api_url:
    description: 'Reoclo API URL (override for self-hosted instances)'
    required: false
    default: 'https://api.reoclo.com'
  force:
    description: 'Override conflict checks for this run (rare; use only for legitimate hotfixes).'
    required: false
    default: 'false'
outputs:
  synced_fqdns:
    description: 'Comma-separated FQDNs whose proxy routes were rewritten or confirmed in this run'
    value: ${{ steps.sync.outputs.synced_fqdns }}
  session_id:
    description: 'Reoclo deploy session ID (for audit)'
    value: ${{ steps.sync.outputs.session_id }}
runs:
  using: 'composite'
  steps:
    - name: Ensure reoclo CLI
      shell: bash
      env:
        REOCLO_PIN: v0.44.0
        # SHA-256 of the pinned release's install.sh (stable across releases). The
        # installer then verifies the downloaded binary against SHA256SUMS, so this
        # gives a tamper-evident chain: pinned hash -> installer -> binary.
        REOCLO_INSTALL_SHA256: 2ea6c2766d2cf5def9a022ed255874f9a48ce1da5184a36df9e8e547a98cfa94
      run: |
        set -euo pipefail
        want="${REOCLO_PIN#v}"
        if command -v reoclo >/dev/null 2>&1 && [ "$(reoclo --version 2>/dev/null || true)" = "$want" ]; then
          echo "reoclo $want already present"
          exit 0
        fi
        dir="${RUNNER_TEMP:-/tmp}/reoclo-bin"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/install.sh" "https://github.com/reoclo/cli/releases/download/${REOCLO_PIN}/install.sh"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${REOCLO_INSTALL_SHA256}  ${dir}/install.sh" | sha256sum -c -
        else
          echo "${REOCLO_INSTALL_SHA256}  ${dir}/install.sh" | shasum -a 256 -c -
        fi
        sh "$dir/install.sh" --version "${REOCLO_PIN}" --install-dir "$dir" --no-modify-path
        echo "$dir" >> "$GITHUB_PATH"
    - name: Deploy sync
      id: sync
      shell: bash
      env:
        REOCLO_AUTOMATION_KEY: ${{ inputs.api_key }}
        REOCLO_API_URL: ${{ inputs.api_url }}
        IN_COMPOSE: ${{ inputs.compose_file }}
        IN_SERVICES: ${{ inputs.services }}
        IN_FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail

        args=(deploy sync --output json)
        if [ -n "$IN_COMPOSE" ]; then args+=(--compose-file "$IN_COMPOSE"); fi
        if [ -n "$IN_SERVICES" ]; then args+=(--services "$IN_SERVICES"); fi
        if [ "$IN_FORCE" = "true" ]; then args+=(--force); fi

        set +e
        out="$(reoclo "${args[@]}")"
        rc=$?
        set -e

        # Write outputs
        {
          echo "session_id=$(printf '%s' "$out" | jq -r '.session_id // ""')"
          echo "synced_fqdns=$(printf '%s' "$out" | jq -r '(.synced_fqdns // []) | join(",")')"
        } >> "$GITHUB_OUTPUT"

        # Write step summary
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## Reoclo Deploy Sync"
            echo ""
            echo "Session: \`$(printf '%s' "$out" | jq -r '.session_id // ""')\`"
            echo ""
            echo "| Container | Status | FQDNs | Notes |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$out" | jq -r '
              .results[]? |
              "| \(.container_name) | \(.status) | \((.synced_fqdns // []) | join(", ") | if . == "" then "-" else . end) | \(.reason // "-") |"
            '
            errors_count="$(printf '%s' "$out" | jq -r '(.errors // []) | length')"
            if [ "$errors_count" -gt 0 ]; then
              echo ""
              echo "### Errors"
              printf '%s' "$out" | jq -r '.errors[]? | "- **\(.container_name)**: \(.reason)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $rc
