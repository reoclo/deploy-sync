name: 'Reoclo Deploy Sync'
description: 'Sync proxy routes with Reoclo after an external container deployment'
branding:
  icon: 'refresh-cw'
  color: 'blue'
inputs:
  api_key:
    description: 'Reoclo tenant API key with `external_deploy` scope'
    required: true
  compose_file:
    description: 'Path to a docker-compose file. Services on the reoclo-proxy network or with `reoclo.managed=true` label are auto-discovered.'
    required: false
  services:
    description: 'Comma-separated list of `container_name:container_port` for non-compose workflows. Mutually exclusive with `compose_file`.'
    required: false
  api_url:
    description: 'Reoclo API URL (override for self-hosted instances)'
    required: false
    default: 'https://api.reoclo.com'
  force:
    description: 'Override conflict checks for this run (rare; use only for legitimate hotfixes).'
    required: false
    default: 'false'
outputs:
  synced_fqdns:
    description: 'Comma-separated FQDNs whose proxy routes were rewritten or confirmed in this run'
  session_id:
    description: 'Reoclo deploy session ID (for audit)'
runs:
  using: 'node20'
  main: 'dist/index.js'
